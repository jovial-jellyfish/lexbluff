<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LexBluff</title>
    <script>
      // GitHub Pages SPA redirect: encode the current path and redirect to index.html
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/lexbluff/?p=' + l.pathname.replace('/lexbluff', '').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
